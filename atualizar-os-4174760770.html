<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizar OS 4174760770</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #0a0a0a;
      color: #fff;
    }
    button {
      background: linear-gradient(135deg, #00D4FF 0%, #00A8CC 100%);
      border: none;
      padding: 12px 24px;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      transition: all 0.3s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .success {
      border-color: #39FF14;
      background: rgba(57, 255, 20, 0.05);
      color: #39FF14;
    }
    .error {
      border-color: #FF0064;
      background: rgba(255, 0, 100, 0.05);
      color: #FF0064;
    }
    h1 {
      color: #00D4FF;
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }
  </style>
</head>
<body>
  <h1>Atualizar OS Samsung 4174760770</h1>
  <p>Este script irá buscar na API Samsung os campos <strong>StatusDesc</strong> e <strong>StReasonDesc</strong> e atualizar a OS no banco de dados.</p>

  <button id="btnAtualizar" onclick="atualizarOS()">Atualizar OS Agora</button>

  <div id="resultado"></div>

  <script>
    const SUPABASE_URL = 'https://gawbsqvoirzehbmhdvmc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdhd2JzcXZvaXJ6ZWhibWhkdm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxOTQ1MzgsImV4cCI6MjA3OTc3MDUzOH0.g6Dz3H7ku5KfG8oDsT53dnvhnl8u-TIF_kilHzYfK-M';
    const UNIDADE_ID = '4d171eac-5aa8-4e42-905d-45f19428439e';

    async function atualizarOS() {
      const btn = document.getElementById('btnAtualizar');
      const resultado = document.getElementById('resultado');

      btn.disabled = true;
      btn.textContent = 'Atualizando...';
      resultado.className = '';
      resultado.textContent = 'Consultando API Samsung...';

      try {
        // Pegar o token de autenticação do localStorage
        const sessionData = localStorage.getItem('sb-gawbsqvoirzehbmhdvmc-auth-token');

        if (!sessionData) {
          throw new Error('Você precisa estar logado no sistema. Faça login primeiro!');
        }

        const session = JSON.parse(sessionData);
        const token = session.access_token;

        if (!token) {
          throw new Error('Token de autenticação não encontrado. Faça login novamente!');
        }

        const response = await fetch(`${SUPABASE_URL}/functions/v1/update-samsung-status`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ unidade_id: UNIDADE_ID })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Erro desconhecido');
        }

        resultado.className = 'success';
        resultado.textContent = `✅ Sucesso!\n\n` +
          `Total de OS na API: ${data.total_os_api}\n` +
          `Total de OS no sistema: ${data.total_os_sistema}\n` +
          `OS atualizadas: ${data.total_atualizadas}\n` +
          `OS não encontradas na API: ${data.total_nao_encontradas}\n\n` +
          `Período consultado: ${data.periodo.de} a ${data.periodo.ate}\n\n` +
          `A OS 4174760770 foi atualizada com sucesso!\n` +
          `Recarregue a página do Kanban para ver as mudanças.`;

        btn.textContent = 'Atualização Concluída ✓';

      } catch (error) {
        resultado.className = 'error';
        resultado.textContent = `❌ Erro:\n\n${error.message}\n\n` +
          `Dica: ${error.message.includes('logado') ?
            'Abra o sistema em outra aba e faça login, depois volte aqui e tente novamente.' :
            'Verifique o console para mais detalhes (F12).'}`;

        btn.disabled = false;
        btn.textContent = 'Tentar Novamente';

        console.error('Erro completo:', error);
      }
    }
  </script>
</body>
</html>
