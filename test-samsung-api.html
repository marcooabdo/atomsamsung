<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste API Samsung GSPN</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
      background: #0a0e14;
      color: #fff;
    }
    .container {
      background: #1a1f2e;
      border: 1px solid #2a3142;
      border-radius: 12px;
      padding: 30px;
    }
    h1 {
      color: #00D4FF;
      margin-bottom: 10px;
    }
    .info {
      background: #00D4FF20;
      border-left: 4px solid #00D4FF;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    button {
      background: #00D4FF;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #00bfe6;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: #0d1117;
      border: 1px solid #2a3142;
      border-radius: 8px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 600px;
      overflow-y: auto;
    }
    .success { color: #00ff88; }
    .error { color: #ff4444; }
    .warning { color: #ffaa00; }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #00D4FF;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    input {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid #2a3142;
      color: #fff;
      border-radius: 6px;
      margin: 5px 0 15px 0;
      font-size: 14px;
    }
    label {
      color: #00D4FF;
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Teste API Samsung GSPN</h1>
    <p style="color: #888;">Teste direto da API Samsung para verificar se está retornando OS</p>

    <div class="info">
      <strong>⚙️ Configuração Atual:</strong><br>
      ASC Code: <code>6030455</code> (São Bernardo do Campo)<br>
      Ambiente: <strong>PRODUÇÃO</strong><br>
      Período: Últimos 5 dias
    </div>

    <label>Token de Produção (já preenchido):</label>
    <input type="text" id="token" value="ea245d49-a4f1-32a6-a202-5bea98f5dd3e" readonly>

    <label>ASC Code:</label>
    <input type="text" id="ascCode" value="6030455" readonly>

    <label>Últimos quantos dias?</label>
    <input type="number" id="dias" value="5" min="1" max="30">

    <div style="margin-top: 20px;">
      <button onclick="testarAPI()" id="btnTestar">
        🚀 TESTAR API SAMSUNG
      </button>
      <button onclick="limparResultado()">
        🗑️ Limpar
      </button>
    </div>

    <div id="resultado" class="result" style="display: none;"></div>
  </div>

  <script>
    async function testarAPI() {
      const btn = document.getElementById('btnTestar');
      const resultado = document.getElementById('resultado');
      const token = document.getElementById('token').value;
      const ascCode = document.getElementById('ascCode').value;
      const dias = parseInt(document.getElementById('dias').value);

      btn.disabled = true;
      btn.innerHTML = '⏳ Consultando API... <span class="loading"></span>';
      resultado.style.display = 'block';
      resultado.innerHTML = '<span class="warning">🔄 Consultando API Samsung GSPN...</span>';

      try {
        const hoje = new Date();
        const dataInicio = new Date(hoje);
        dataInicio.setDate(hoje.getDate() - dias);

        const formatDate = (date) => {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, '0');
          const day = String(date.getDate()).padStart(2, '0');
          return `${year}${month}${day}`;
        };

        const payload = {
          ASCCode: ascCode,
          FromDate: formatDate(dataInicio),
          ToDate: formatDate(hoje)
        };

        resultado.innerHTML += `\n\n<span class="warning">📅 Período consultado:</span>\n${formatDate(dataInicio)} até ${formatDate(hoje)}`;
        resultado.innerHTML += `\n\n<span class="warning">📦 Payload enviado:</span>\n${JSON.stringify(payload, null, 2)}`;

        const apiUrl = 'https://latam.ipaas.samsung.com/latam/gcic/GetSOList/1.0/ImportSet';

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        resultado.innerHTML += `\n\n<span class="warning">📡 Status HTTP:</span> ${response.status} ${response.statusText}`;

        if (!response.ok) {
          const errorText = await response.text();
          resultado.innerHTML += `\n\n<span class="error">❌ ERRO NA API:</span>\n${errorText}`;
          return;
        }

        const data = await response.json();
        const osList = data.ServiceOrderList || data.data || [];

        resultado.innerHTML += `\n\n<span class="success">✅ SUCESSO!</span>`;
        resultado.innerHTML += `\n\n<span class="success">📊 Total de OS encontradas:</span> ${osList.length}`;

        if (osList.length > 0) {
          resultado.innerHTML += `\n\n<span class="success">🎯 Primeiras OS encontradas:</span>`;
          osList.slice(0, 5).forEach((os, idx) => {
            resultado.innerHTML += `\n\n<strong>${idx + 1}. OS #${os.SvcOrderNo}</strong>`;
            resultado.innerHTML += `\n   Cliente: ${os.CustFirstName || ''} ${os.CustLastName || ''}`.trim();
            resultado.innerHTML += `\n   Modelo: ${os.Model || 'N/A'}`;
            resultado.innerHTML += `\n   IMEI: ${os.IMEI || 'N/A'}`;
            resultado.innerHTML += `\n   Cidade: ${os.CustAddrCity || 'N/A'}`;
            resultado.innerHTML += `\n   Defeito: ${os.DefectDesc || 'N/A'}`;
          });

          if (osList.length > 5) {
            resultado.innerHTML += `\n\n<span class="warning">... e mais ${osList.length - 5} OS</span>`;
          }
        } else {
          resultado.innerHTML += `\n\n<span class="warning">⚠️ Nenhuma OS encontrada no período</span>`;
        }

        resultado.innerHTML += `\n\n<span class="warning">📄 Resposta completa da API:</span>\n${JSON.stringify(data, null, 2)}`;

      } catch (error) {
        resultado.innerHTML += `\n\n<span class="error">❌ ERRO:</span>\n${error.message}`;
        console.error('Erro:', error);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 TESTAR API SAMSUNG';
      }
    }

    function limparResultado() {
      document.getElementById('resultado').style.display = 'none';
      document.getElementById('resultado').innerHTML = '';
    }
  </script>
</body>
</html>
